name: CI/CD Church Hub Landing

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      PROJECT_ID: caci-church-hub
      REGION: europe-west1
      SERVICE_NAME: church-hub-landing
      IMAGE_SHA: europe-west1-docker.pkg.dev/caci-church-hub/church-hub/landing:${{ github.sha }}
      IMAGE_LATEST: europe-west1-docker.pkg.dev/caci-church-hub/church-hub/landing:latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # 🔐 GCP Auth
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/901047758364/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: church-hub-cd@caci-church-hub.iam.gserviceaccount.com

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      # 🐳 Build + Push
      - name: Build & push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE_SHA }}

      - name: Tag image as latest
        run: |
          gcloud artifacts docker tags add \
            $IMAGE_SHA \
            $IMAGE_LATEST \
            --project=$PROJECT_ID \
            --quiet

      # 🚀 Deploy
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE_NAME \
            --image $IMAGE_SHA \
            --region $REGION \
            --platform managed \
            --execution-environment gen2 \
            --allow-unauthenticated \
            --service-account=church-hub-cd@caci-church-hub.iam.gserviceaccount.com \
            --memory 256Mi \
            --cpu 1 \
            --port 8080 \
            --quiet
